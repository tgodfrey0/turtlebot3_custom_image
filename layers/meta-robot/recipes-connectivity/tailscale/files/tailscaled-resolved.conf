# Keep tailscaled in systemd-resolved DNS mode.
#
# When this device is on restrictive networks (public UDP/53 blocked),
# tailscaled must read its upstream resolvers from systemd-resolved rather than
# take over /etc/resolv.conf in direct-file mode. Ordering after
# systemd-resolved.service ensures resolved is up (and owns resolv.conf) when
# tailscaled starts, so MagicDNS keeps working across reboots.
[Unit]
After=systemd-resolved.service
Wants=systemd-resolved.service