# uav-companion.conf - Custom distribution for UAV/robot images
#
# Replaces the stock "Poky" branding in /etc/issue (login banner),
# /etc/os-release and the shell prompt prefix.
#
# NOTE: require FIRST, then override - anything set after the require wins
# over poky.conf's own assignments.

require conf/distro/poky.conf

DISTRO = "uav-companion"
DISTRO_NAME = "UAV Companion"
DISTRO_VERSION ?= "1.0"
DISTRO_CODENAME = "uav"

# Never ship debug-tweaks in this distro, regardless of what
# local.conf or image recipes request.
IMAGE_FEATURES:remove = "debug-tweaks"

# Accept firmware license needed for Pi 5 WiFi (Broadcom/Synaptics blobs)
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# Enable container/virtualization kernel features and tooling (meta-virtualization,
# provides podman and friends). Also pulls in kernel config for cgroups/netfilter.
DISTRO_FEATURES:append = " virtualization"

# Disable serial console so /dev/ttyAMA* is available for user-space
# applications (e.g. robot serial links) without agetty locking the port.
# SERIAL_CONSOLES (plural) is the active variable in Yocto 4.2+; the old
# singular SERIAL_CONSOLE was removed.
SERIAL_CONSOLES = ""
# Prevent rpi-cmdline.bb from appending console=serial0,115200 to cmdline.txt
# (ENABLE_UART=1 is kept for UART hardware enablement in config.txt).
CMDLINE_SERIAL = ""
