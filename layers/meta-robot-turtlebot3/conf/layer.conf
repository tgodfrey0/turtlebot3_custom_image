# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-robot-turtlebot3"
BBFILE_PATTERN_meta-robot-turtlebot3 := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-robot-turtlebot3 = "6"

LAYERSERIES_COMPAT_meta-robot-turtlebot3 = "kirkstone scarthgap"
