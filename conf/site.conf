# site.conf - Shared Yocto build configuration
#
# This file is copied into the build directory by setup-env.sh.
# Contains common settings for all robot image builds.

# Download directory - shared across builds
DL_DIR ?= "${TOPDIR}/../downloads"

# Shared state cache - speeds up rebuilds
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

# Machine configuration
# Override in local.conf for specific builds
# MACHINE ?= "raspberrypi4-64"

# Parallel build settings
# Adjust based on your host system
BB_NUMBER_THREADS ?= "$(nproc)"
PARALLEL_MAKE ?= "-j $(nproc)"

# Enable disk space monitoring
BB_DISKMON_DIRS = "DL_DIR=${DL_DIR} 10GSSTATE_DIR=${SSTATE_DIR} 10G"

# Image features
IMAGE_FEATURES:remove = "debug-tweaks"

# Enable SSH server by default
IMAGE_FEATURES:append = " ssh-server-openssh"

# Package management - use ipk for smaller images
PACKAGE_CLASSES ?= "package_ipk"

# Let the SDK produce .deb packages too
SDK_PACKAGE_CLASSES = "package_rpm"

# QT without X11 for headless robots
DISTRO_FEATURES:remove = "x11"

# Enable systemd
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES:remove = "sysvinit"

# Disable generated mirrors, use upstream
INHERIT:remove = "rm_work"
