repositories:
  - name: poky
    url: https://git.yoctoproject.org/git/poky
    ref: kirkstone
    layers:
      - meta
      - meta-poky
      - meta-yocto-bsp

  - name: meta-openembedded
    url: https://github.com/openembedded/meta-openembedded.git
    ref: kirkstone
    layers:
      - meta-oe
      - meta-python
      - meta-networking

  - name: meta-raspberrypi
    url: https://git.yoctoproject.org/git/meta-raspberrypi
    ref: kirkstone
    layers:
      - meta-raspberrypi

  - name: meta-robot
    url: file://../../layers/meta-robot
    path: layers/meta-robot
    # local layer (no ref required)

# Notes:
# - Default Yocto ref: kirkstone (latest LTS at time of scaffold). Change refs per-run if desired.
# - This generic config enables core layers and the local meta-robot layer for migrated recipes.
