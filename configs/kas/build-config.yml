header:
  version: 14
  includes:
    - robot-settings.yml
    - local-overrides.yml

machine: raspberrypi5
distro: uav-companion
target: robot-image

repos:
  poky:
    path: layers/poky
    url: https://git.yoctoproject.org/git/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    path: layers/meta-openembedded
    url: https://github.com/openembedded/meta-openembedded.git
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-virtualization:
    path: layers/meta-virtualization
    url: https://git.yoctoproject.org/git/meta-virtualization
    branch: scarthgap
    layers:
      .:

  meta-raspberrypi:
    path: layers/meta-raspberrypi
    url: https://git.yoctoproject.org/git/meta-raspberrypi
    branch: scarthgap
    layers:
      .:

  meta-robot:
    path: layers/meta-robot

  meta-tailscale:
    path: layers/meta-tailscale
    url: https://github.com/ChristophHandschuh/meta-tailscale.git
    branch: master
    layers:
      .:

  meta-clang:
    path: layers/meta-clang
    url: https://github.com/kraj/meta-clang.git
    branch: scarthgap
    layers:
      .:
